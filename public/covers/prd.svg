<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgPrd" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e0c0a"/>
      <stop offset="100%" stop-color="#1a1714"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgPrd)"/>

  <g opacity="0.04" stroke="#b8873a" stroke-width="0.5">
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
  </g>

  <!-- Stacked document motif -->
  <g transform="translate(560, 110)">
    <rect x="20" y="20" width="140" height="180" fill="none" stroke="#b8873a" stroke-width="0.8" opacity="0.18"/>
    <rect x="10" y="10" width="140" height="180" fill="none" stroke="#b8873a" stroke-width="0.8" opacity="0.28"/>
    <rect x="0" y="0" width="140" height="180" fill="#0e0c0a" stroke="#b8873a" stroke-width="1.2" opacity="0.85"/>

    <line x1="14" y1="24" x2="70" y2="24" stroke="#b8873a" stroke-width="1" opacity="0.6"/>
    <line x1="14" y1="44" x2="126" y2="44" stroke="#b8873a" stroke-width="0.6" opacity="0.3">
      <animate attributeName="opacity" values="0.15;0.45;0.15" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="14" y1="58" x2="120" y2="58" stroke="#b8873a" stroke-width="0.6" opacity="0.3"/>
    <line x1="14" y1="72" x2="100" y2="72" stroke="#b8873a" stroke-width="0.6" opacity="0.3"/>

    <rect x="14" y="96" width="112" height="28" fill="none" stroke="#b8873a" stroke-width="0.6" opacity="0.25"/>
    <rect x="14" y="96" width="40" height="28" fill="#b8873a" opacity="0.25">
      <animate attributeName="width" values="0;40" dur="1.5s" begin="0.3s" fill="freeze"/>
    </rect>

    <line x1="14" y1="140" x2="126" y2="140" stroke="#b8873a" stroke-width="0.6" opacity="0.3"/>
    <line x1="14" y1="154" x2="110" y2="154" stroke="#b8873a" stroke-width="0.6" opacity="0.3"/>
    <line x1="14" y1="168" x2="90" y2="168" stroke="#b8873a" stroke-width="0.6" opacity="0.3"/>
  </g>

  <line x1="60" y1="320" x2="60" y2="320" stroke="#b8873a" stroke-width="1" opacity="0.4">
    <animate attributeName="x2" values="60;350;350" dur="2s" fill="freeze" keyTimes="0;0.6;1"/>
    <animate attributeName="opacity" values="0;0.4;0.4" dur="1s" fill="freeze"/>
  </line>

  <text x="60" y="105" fill="#b8873a" font-family="monospace" font-size="10" letter-spacing="0.25em" opacity="0.5">
    FORMACAO DEV.IA
    <animate attributeName="opacity" values="0;0.5" dur="1.5s" fill="freeze"/>
  </text>

  <text x="60" y="180" fill="#b8873a" font-family="Georgia, serif" font-size="72" font-weight="900" opacity="0.08">
    PRD
    <animate attributeName="opacity" values="0;0.08" dur="2s" fill="freeze"/>
  </text>

  <text x="60" y="280" fill="#f4f0e8" font-family="Georgia, serif" font-size="42" font-weight="700" letter-spacing="-0.02em">
    Requisitos
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.3s" fill="freeze"/>
  </text>

  <text x="60" y="310" fill="#7a7268" font-family="Georgia, serif" font-size="16" font-style="italic">
    Documento de produto, ponta a ponta
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.6s" fill="freeze"/>
  </text>

  <g opacity="0.3">
    <circle cx="60" cy="400" r="2" fill="#b8873a"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="75" cy="400" r="2" fill="#b8873a"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="400" r="2" fill="#b8873a"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="105" cy="400" r="2" fill="#b8873a"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
