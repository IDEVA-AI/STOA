<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e0c0a"/>
      <stop offset="100%" stop-color="#1a1714"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b8873a"/>
      <stop offset="100%" stop-color="#e8d5b0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg1)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#b8873a" stroke-width="0.5">
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
  </g>

  <!-- Animated concentric circles -->
  <g transform="translate(600, 200)">
    <circle cx="0" cy="0" r="120" stroke="#b8873a" stroke-width="0.5" opacity="0.1" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="90" stroke="#b8873a" stroke-width="0.5" opacity="0.15" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="45s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="60" stroke="#b8873a" stroke-width="1" opacity="0.2" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbiting dots -->
    <circle cx="120" cy="0" r="3" fill="#b8873a" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="0" r="2.5" fill="#b8873a" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="45s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="0" r="2" fill="#b8873a" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </circle>

    <!-- Center pulse -->
    <circle cx="0" cy="0" r="8" fill="#b8873a" opacity="0.3">
      <animate attributeName="r" values="8;12;8" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="4" fill="#b8873a" opacity="0.8"/>
  </g>

  <!-- Animated horizontal line -->
  <line x1="60" y1="320" x2="60" y2="320" stroke="#b8873a" stroke-width="1" opacity="0.4">
    <animate attributeName="x2" values="60;350;350" dur="2s" fill="freeze" keyTimes="0;0.6;1"/>
    <animate attributeName="opacity" values="0;0.4;0.4" dur="1s" fill="freeze"/>
  </line>

  <!-- Label -->
  <text x="60" y="105" fill="#b8873a" font-family="monospace" font-size="10" letter-spacing="0.25em" opacity="0.5">
    FORMACAO DEV.IA
    <animate attributeName="opacity" values="0;0.5" dur="1.5s" fill="freeze"/>
  </text>

  <!-- Module number -->
  <text x="60" y="180" fill="#b8873a" font-family="Georgia, serif" font-size="72" font-weight="900" opacity="0.08">
    01
    <animate attributeName="opacity" values="0;0.08" dur="2s" fill="freeze"/>
  </text>

  <!-- Title -->
  <text x="60" y="280" fill="#f4f0e8" font-family="Georgia, serif" font-size="42" font-weight="700" letter-spacing="-0.02em">
    Conceitos
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.3s" fill="freeze"/>
  </text>

  <!-- Subtitle -->
  <text x="60" y="310" fill="#7a7268" font-family="Georgia, serif" font-size="16" font-style="italic">
    Fundamentos e modelos mentais
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.6s" fill="freeze"/>
  </text>

  <!-- Bottom accent dots -->
  <g opacity="0.3">
    <circle cx="60" cy="400" r="2" fill="#b8873a">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75" cy="400" r="2" fill="#b8873a">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="400" r="2" fill="#b8873a">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="105" cy="400" r="2" fill="#b8873a">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>