<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgEx" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e0c0a"/>
      <stop offset="100%" stop-color="#1a1714"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgEx)"/>

  <g opacity="0.04" stroke="#b8873a" stroke-width="0.5">
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
  </g>

  <!-- Plus constellation -->
  <g transform="translate(620, 225)" stroke="#b8873a" fill="none">
    <!-- Large central plus -->
    <g stroke-width="2" opacity="0.85">
      <line x1="-40" y1="0" x2="40" y2="0"/>
      <line x1="0" y1="-40" x2="0" y2="40"/>
    </g>
    <circle r="64" stroke-width="0.6" opacity="0.25">
      <animate attributeName="r" values="58;70;58" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="96" stroke-width="0.4" opacity="0.15">
      <animate attributeName="r" values="92;104;92" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- Satellite plus signs -->
    <g transform="translate(-120, -80)" stroke-width="1" opacity="0.5">
      <line x1="-10" y1="0" x2="10" y2="0"/>
      <line x1="0" y1="-10" x2="0" y2="10"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(130, -110)" stroke-width="1" opacity="0.5">
      <line x1="-8" y1="0" x2="8" y2="0"/>
      <line x1="0" y1="-8" x2="0" y2="8"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" begin="1s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(150, 90)" stroke-width="1" opacity="0.5">
      <line x1="-12" y1="0" x2="12" y2="0"/>
      <line x1="0" y1="-12" x2="0" y2="12"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" begin="2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(-140, 100)" stroke-width="1" opacity="0.5">
      <line x1="-9" y1="0" x2="9" y2="0"/>
      <line x1="0" y1="-9" x2="0" y2="9"/>
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" begin="3s" repeatCount="indefinite"/>
    </g>

    <!-- Connective dashed lines -->
    <line x1="-40" y1="0" x2="-130" y2="100" stroke-width="0.4" opacity="0.2" stroke-dasharray="3 4"/>
    <line x1="40" y1="0" x2="140" y2="85" stroke-width="0.4" opacity="0.2" stroke-dasharray="3 4"/>
    <line x1="0" y1="-40" x2="-110" y2="-75" stroke-width="0.4" opacity="0.2" stroke-dasharray="3 4"/>
    <line x1="0" y1="-40" x2="120" y2="-100" stroke-width="0.4" opacity="0.2" stroke-dasharray="3 4"/>
  </g>

  <line x1="60" y1="320" x2="60" y2="320" stroke="#b8873a" stroke-width="1" opacity="0.4">
    <animate attributeName="x2" values="60;350;350" dur="2s" fill="freeze" keyTimes="0;0.6;1"/>
    <animate attributeName="opacity" values="0;0.4;0.4" dur="1s" fill="freeze"/>
  </line>

  <text x="60" y="105" fill="#b8873a" font-family="monospace" font-size="10" letter-spacing="0.25em" opacity="0.5">
    FORMACAO DEV.IA
    <animate attributeName="opacity" values="0;0.5" dur="1.5s" fill="freeze"/>
  </text>

  <text x="60" y="180" fill="#b8873a" font-family="Georgia, serif" font-size="72" font-weight="900" opacity="0.08">
    +
    <animate attributeName="opacity" values="0;0.08" dur="2s" fill="freeze"/>
  </text>

  <text x="60" y="280" fill="#f4f0e8" font-family="Georgia, serif" font-size="42" font-weight="700" letter-spacing="-0.02em">
    Aulas Extras
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.3s" fill="freeze"/>
  </text>

  <text x="60" y="310" fill="#7a7268" font-family="Georgia, serif" font-size="16" font-style="italic">
    Material complementar da formacao
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.6s" fill="freeze"/>
  </text>

  <g opacity="0.3">
    <circle cx="60" cy="400" r="2" fill="#b8873a"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="75" cy="400" r="2" fill="#b8873a"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="400" r="2" fill="#b8873a"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="105" cy="400" r="2" fill="#b8873a"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
