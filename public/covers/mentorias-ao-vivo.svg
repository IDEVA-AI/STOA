<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e0c0a"/>
      <stop offset="100%" stop-color="#1a1714"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg1)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#b8873a" stroke-width="0.5">
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
  </g>

  <!-- Live pulse / broadcast motif -->
  <g transform="translate(620, 190)">
    <!-- Signal waves -->
    <path d="M-40,-60 Q0,-80 40,-60" stroke="#b8873a" stroke-width="1" fill="none" opacity="0.12">
      <animate attributeName="opacity" values="0.05;0.2;0.05" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M-60,-85 Q0,-115 60,-85" stroke="#b8873a" stroke-width="0.8" fill="none" opacity="0.08">
      <animate attributeName="opacity" values="0.03;0.15;0.03" dur="3s" begin="0.4s" repeatCount="indefinite"/>
    </path>
    <path d="M-80,-110 Q0,-150 80,-110" stroke="#b8873a" stroke-width="0.6" fill="none" opacity="0.06">
      <animate attributeName="opacity" values="0.02;0.1;0.02" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    </path>

    <!-- Person silhouette (speaker) -->
    <circle cx="0" cy="-30" r="18" stroke="#b8873a" stroke-width="1" fill="none" opacity="0.2"/>
    <circle cx="0" cy="-30" r="10" fill="#b8873a" opacity="0.15"/>
    <rect x="-25" y="-5" width="50" height="60" rx="8" stroke="#b8873a" stroke-width="1" fill="none" opacity="0.15"/>

    <!-- Live dot -->
    <circle cx="50" cy="-30" r="5" fill="#c0392b" opacity="0.8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="-30" r="5" fill="none" stroke="#c0392b" stroke-width="1" opacity="0.3">
      <animate attributeName="r" values="5;12;5" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Connecting lines to audience -->
    <g opacity="0.08" stroke="#b8873a" stroke-width="0.5">
      <line x1="-30" y1="70" x2="-70" y2="120"/>
      <line x1="0" y1="70" x2="0" y2="130"/>
      <line x1="30" y1="70" x2="70" y2="120"/>
    </g>

    <!-- Audience dots -->
    <circle cx="-70" cy="130" r="4" fill="#b8873a" opacity="0.15"/>
    <circle cx="0" cy="140" r="4" fill="#b8873a" opacity="0.15"/>
    <circle cx="70" cy="130" r="4" fill="#b8873a" opacity="0.15"/>
  </g>

  <!-- Animated horizontal line -->
  <line x1="60" y1="320" x2="60" y2="320" stroke="#b8873a" stroke-width="1" opacity="0.4">
    <animate attributeName="x2" values="60;350;350" dur="2s" fill="freeze" keyTimes="0;0.6;1"/>
  </line>

  <!-- Label -->
  <text x="60" y="105" fill="#b8873a" font-family="monospace" font-size="10" letter-spacing="0.25em" opacity="0.5">
    FORMACAO DEV.IA
  </text>

  <!-- Module number -->
  <text x="60" y="180" fill="#b8873a" font-family="Georgia, serif" font-size="72" font-weight="900" opacity="0.08">
    03
  </text>

  <!-- Title -->
  <text x="60" y="280" fill="#f4f0e8" font-family="Georgia, serif" font-size="42" font-weight="700" letter-spacing="-0.02em">
    Mentorias
  </text>

  <!-- Subtitle -->
  <text x="60" y="310" fill="#7a7268" font-family="Georgia, serif" font-size="16" font-style="italic">
    Sessoes ao vivo e tira-duvidas
  </text>

  <!-- Bottom accent dots -->
  <g opacity="0.3">
    <circle cx="60" cy="400" r="2" fill="#c0392b">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75" cy="400" r="2" fill="#b8873a"/>
    <circle cx="90" cy="400" r="2" fill="#b8873a"/>
    <circle cx="105" cy="400" r="2" fill="#b8873a"/>
  </g>
</svg>
